<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliverables Dashboard</title>
    <!-- Load React, ReactDOM, Babel, and Tailwind directly in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        // Inline SVG Icons to replace the lucide-react package
        const IconUpload = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconDownload = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconSearch = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconFilter = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const IconCheckSquare = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
        const IconSquare = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>;
        const IconCheckCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
        const IconFileText = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
        const IconFileSpreadsheet = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>;
        const IconAlertCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const IconTrendingUp = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;

        const generateMockData = () => {
            const companies = ['Acme Corp', 'Globex', 'Soylent', 'Initech', 'Umbrella Corp', 'Stark Ind.', 'Wayne Ent.', 'Massive Dynamic'];
            return Array.from({ length: 53 }).map((_, index) => {
                const startMonth = Math.floor(Math.random() * 6) + 1;
                const endMonth = startMonth + Math.floor(Math.random() * 6) + 1;
                const receiveNote = Math.random() > 0.4;
                const invoice = receiveNote ? Math.random() > 0.3 : Math.random() > 0.8; 
                return {
                    id: `CTR-2026-${String(index + 1).padStart(3, '0')}`,
                    client: companies[index % companies.length] + (index > 7 ? ` ${index}` : ''),
                    startDate: `2026-${String(startMonth).padStart(2, '0')}-01`,
                    endDate: `2026-${String(endMonth > 12 ? 12 : endMonth).padStart(2, '0')}-${String(Math.floor(Math.random() * 28) + 1).padStart(2, '0')}`,
                    receiveNoteSigned: receiveNote,
                    invoiceSubmitted: invoice,
                };
            });
        };

        function App() {
            const [contracts, setContracts] = useState(generateMockData());
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const fileInputRef = useRef(null);
            const [uploadMessage, setUploadMessage] = useState('');

            const toggleReceiveNote = (id) => {
                setContracts(contracts.map(c => c.id === id ? { ...c, receiveNoteSigned: !c.receiveNoteSigned } : c));
            };

            const toggleInvoice = (id) => {
                setContracts(contracts.map(c => c.id === id ? { ...c, invoiceSubmitted: !c.invoiceSubmitted } : c));
            };

            const handleExportCSV = () => {
                const headers = "Contract ID,Client Name,Start Date,End Date,Receive Note Signed,Invoice Submitted\n";
                const rows = filteredContracts.map(c => 
                    `${c.id},"${c.client}",${c.startDate},${c.endDate},${c.receiveNoteSigned ? 'Yes' : 'No'},${c.invoiceSubmitted ? 'Yes' : 'No'}`
                ).join("\n");
                const blob = new Blob([headers + rows], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'contracts_export.csv';
                a.click();
                window.URL.revokeObjectURL(url);
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        if (lines.length < 2) {
                            setUploadMessage('Error: CSV must contain a header row and data.');
                            setTimeout(() => setUploadMessage(''), 5000);
                            return;
                        }
                        
                        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                        const idIdx = headers.findIndex(h => h.includes('id'));
                        const clientIdx = headers.findIndex(h => h.includes('client'));
                        const startIdx = headers.findIndex(h => h.includes('start'));
                        const endIdx = headers.findIndex(h => h.includes('end'));
                        const receiveIdx = headers.findIndex(h => h.includes('receive'));
                        const invoiceIdx = headers.findIndex(h => h.includes('invoice'));

                        if (idIdx === -1 || clientIdx === -1) {
                            setUploadMessage('Error: CSV must contain "ID" and "Client" columns.');
                            setTimeout(() => setUploadMessage(''), 5000);
                            return;
                        }

                        const newContracts = lines.slice(1).map((line, index) => {
                            const values = line.split(',').map(v => v.trim());
                            const rVal = receiveIdx !== -1 ? (values[receiveIdx] || '').toLowerCase() : '';
                            const iVal = invoiceIdx !== -1 ? (values[invoiceIdx] || '').toLowerCase() : '';
                            
                            return {
                                id: values[idIdx] || `NEW-${index}`,
                                client: values[clientIdx] || 'Unknown Client',
                                startDate: startIdx !== -1 ? values[startIdx] : '2026-01-01',
                                endDate: endIdx !== -1 ? values[endIdx] : '2026-12-31',
                                receiveNoteSigned: rVal === 'true' || rVal === 'yes' || rVal === '1',
                                invoiceSubmitted: iVal === 'true' || iVal === 'yes' || iVal === '1',
                            };
                        });
                        
                        setContracts(newContracts);
                        setUploadMessage(`✅ Successfully loaded ${newContracts.length} contracts.`);
                        setTimeout(() => setUploadMessage(''), 5000);
                    } catch (err) {
                        setUploadMessage('❌ Error parsing CSV file.');
                        setTimeout(() => setUploadMessage(''), 5000);
                    }
                };
                reader.readAsText(file);
                event.target.value = null; 
            };

            const metrics = useMemo(() => {
                const total = contracts.length;
                const closed = contracts.filter(c => c.receiveNoteSigned && c.invoiceSubmitted).length;
                const pendingNotes = contracts.filter(c => !c.receiveNoteSigned).length;
                const pendingInvoices = contracts.filter(c => c.receiveNoteSigned && !c.invoiceSubmitted).length;
                return { total, closed, pendingNotes, pendingInvoices, completionRate: total > 0 ? Math.round((closed / total) * 100) : 0 };
            }, [contracts]);

            const filteredContracts = useMemo(() => {
                return contracts.filter(c => {
                    const isClosed = c.receiveNoteSigned && c.invoiceSubmitted;
                    const matchesSearch = c.id.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          c.client.toLowerCase().includes(searchTerm.toLowerCase());
                    if (!matchesSearch) return false;
                    if (statusFilter === 'Closed') return isClosed;
                    if (statusFilter === 'Pending') return !isClosed;
                    return true;
                });
            }, [contracts, searchTerm, statusFilter]);

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Deliverables Dashboard</h1>
                                <div className="flex items-center gap-4 mt-1">
                                    <p className="text-slate-500 flex items-center gap-2">
                                        <IconFileSpreadsheet className="w-4 h-4" /> 
                                        Tracking {contracts.length} imported contracts
                                    </p>
                                    {uploadMessage && (
                                        <span className={`text-xs font-medium px-2.5 py-1 rounded-md ${uploadMessage.includes('Error') ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                            {uploadMessage}
                                        </span>
                                    )}
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                <button onClick={handleExportCSV} className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-slate-50 transition-colors text-sm font-medium text-slate-600">
                                    <IconDownload className="w-4 h-4" />
                                    Export CSV
                                </button>
                                
                                <input type="file" accept=".csv" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg shadow-sm hover:bg-blue-700 transition-colors text-sm font-medium">
                                    <IconUpload className="w-4 h-4" />
                                    Upload Data (CSV)
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm font-medium text-slate-500">Total Contracts</p>
                                        <p className="text-3xl font-bold text-slate-900 mt-2">{metrics.total}</p>
                                    </div>
                                    <div className="p-3 bg-blue-50 text-blue-600 rounded-lg"><IconFileText className="w-6 h-6" /></div>
                                </div>
                                <div className="mt-4 flex items-center gap-2 text-sm text-slate-600">
                                    <div className="w-full bg-slate-100 rounded-full h-2">
                                        <div className="bg-blue-600 h-2 rounded-full" style={{ width: '100%' }}></div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm font-medium text-slate-500">Contracts Closed</p>
                                        <p className="text-3xl font-bold text-emerald-600 mt-2">{metrics.closed}</p>
                                    </div>
                                    <div className="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><IconCheckCircle className="w-6 h-6" /></div>
                                </div>
                                <div className="mt-4 flex items-center gap-2 text-sm text-slate-600">
                                    <div className="w-full bg-slate-100 rounded-full h-2">
                                        <div className="bg-emerald-500 h-2 rounded-full transition-all duration-500" style={{ width: `${metrics.completionRate}%` }}></div>
                                    </div>
                                    <span className="font-medium">{metrics.completionRate}%</span>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm font-medium text-slate-500">Missing Receive Notes</p>
                                        <p className="text-3xl font-bold text-amber-600 mt-2">{metrics.pendingNotes}</p>
                                    </div>
                                    <div className="p-3 bg-amber-50 text-amber-600 rounded-lg"><IconAlertCircle className="w-6 h-6" /></div>
                                </div>
                                <p className="text-sm text-slate-500 mt-4">Require client signature</p>
                            </div>

                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-sm font-medium text-slate-500">Missing Invoices</p>
                                        <p className="text-3xl font-bold text-rose-600 mt-2">{metrics.pendingInvoices}</p>
                                    </div>
                                    <div className="p-3 bg-rose-50 text-rose-600 rounded-lg"><IconTrendingUp className="w-6 h-6" /></div>
                                </div>
                                <p className="text-sm text-slate-500 mt-4">Awaiting finance team</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="p-4 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row justify-between gap-4 items-center">
                                <div className="relative w-full sm:w-72">
                                    <IconSearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input 
                                        type="text" 
                                        placeholder="Search by ID or Client..." 
                                        className="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                <div className="flex items-center gap-2 w-full sm:w-auto">
                                    <IconFilter className="w-4 h-4 text-slate-400" />
                                    <select 
                                        className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-blue-500 block w-full py-2 px-3"
                                        value={statusFilter}
                                        onChange={(e) => setStatusFilter(e.target.value)}
                                    >
                                        <option value="All">All Statuses</option>
                                        <option value="Pending">Active / Pending</option>
                                        <option value="Closed">Contract Closed</option>
                                    </select>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm text-slate-600">
                                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                        <tr>
                                            <th className="px-6 py-4 font-semibold">Contract ID</th>
                                            <th className="px-6 py-4 font-semibold">Client Name</th>
                                            <th className="px-6 py-4 font-semibold">Timeline</th>
                                            <th className="px-6 py-4 font-semibold text-center">Receive Note Signed</th>
                                            <th className="px-6 py-4 font-semibold text-center">Invoice Submitted</th>
                                            <th className="px-6 py-4 font-semibold">Progress</th>
                                            <th className="px-6 py-4 font-semibold text-right">Overall Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredContracts.length === 0 ? (
                                            <tr>
                                                <td colSpan="7" className="px-6 py-12 text-center text-slate-500">
                                                    No contracts found matching your filters.
                                                </td>
                                            </tr>
                                        ) : (
                                            filteredContracts.map((contract) => {
                                                const isClosed = contract.receiveNoteSigned && contract.invoiceSubmitted;
                                                const progressPercent = (contract.receiveNoteSigned ? 50 : 0) + (contract.invoiceSubmitted ? 50 : 0);
                                                
                                                return (
                                                    <tr key={contract.id} className="bg-white border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className="px-6 py-4 font-medium text-slate-900 whitespace-nowrap">{contract.id}</td>
                                                        <td className="px-6 py-4">{contract.client}</td>
                                                        <td className="px-6 py-4">
                                                            <div className="flex flex-col text-xs">
                                                                <span className="text-slate-500">Start: <span className="font-medium text-slate-700">{contract.startDate}</span></span>
                                                                <span className="text-slate-500 mt-1">End: <span className="font-medium text-slate-700">{contract.endDate}</span></span>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 text-center">
                                                            <button 
                                                                onClick={() => toggleReceiveNote(contract.id)}
                                                                className={`inline-flex p-1 rounded-md transition-colors ${contract.receiveNoteSigned ? 'text-emerald-600 hover:bg-emerald-50' : 'text-slate-400 hover:bg-slate-100'}`}
                                                            >
                                                                {contract.receiveNoteSigned ? <IconCheckSquare className="w-5 h-5" /> : <IconSquare className="w-5 h-5" />}
                                                            </button>
                                                        </td>
                                                        <td className="px-6 py-4 text-center">
                                                            <button 
                                                                onClick={() => toggleInvoice(contract.id)}
                                                                className={`inline-flex p-1 rounded-md transition-colors ${contract.invoiceSubmitted ? 'text-emerald-600 hover:bg-emerald-50' : 'text-slate-400 hover:bg-slate-100'}`}
                                                            >
                                                                {contract.invoiceSubmitted ? <IconCheckSquare className="w-5 h-5" /> : <IconSquare className="w-5 h-5" />}
                                                            </button>
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-16 sm:w-20 bg-slate-200 rounded-full h-2 overflow-hidden shadow-inner">
                                                                    <div 
                                                                        className={`h-full rounded-full transition-all duration-500 ${progressPercent === 100 ? 'bg-emerald-500' : progressPercent === 50 ? 'bg-amber-400' : 'bg-transparent'}`} 
                                                                        style={{ width: `${progressPercent}%` }}
                                                                    ></div>
                                                                </div>
                                                                <span className="text-xs text-slate-500 font-medium w-8 text-right">{progressPercent}%</span>
                                                            </div>
                                                        </td>
                                                        <td className="px-6 py-4 text-right">
                                                            <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold ${isClosed ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-50 text-blue-700'}`}>
                                                                {isClosed ? <IconCheckCircle className="w-3.5 h-3.5" /> : <IconCircle className="w-3.5 h-3.5" />}
                                                                {isClosed ? 'Contract Closed' : 'In Progress'}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="p-4 border-t border-slate-200 bg-white text-sm text-slate-500 flex justify-between items-center">
                                <span>Showing {filteredContracts.length} of {contracts.length} contracts</span>
                                <span className="text-xs italic text-slate-400">Click checkboxes to test logic</span>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
