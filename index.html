<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliverables Dashboard</title>
    <!-- Load React, ReactDOM, Babel, and Tailwind directly in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        // --- Configuration ---
        // IMPORTANT: Paste your Gemini API key here to enable AI features on Vercel
        const apiKey = "AIzaSyAUIwBVl-xb_0ifO2Trcs4bGFkuSO3ztBU"; 

        // Inline SVG Icons
        const IconUpload = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconDownload = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconSearch = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconFilter = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const IconCheckSquare = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
        const IconSquare = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>;
        const IconCheckCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
        const IconFileText = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
        const IconFileSpreadsheet = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>;
        const IconAlertCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const IconTrendingUp = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const IconSparkles = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>;
        const IconChevronDown = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
        const IconChevronUp = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>;
        const IconX = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconLoader2 = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;

        const generateMockData = () => {
            const companies = ['Acme Corp', 'Globex', 'Soylent', 'Initech', 'Umbrella Corp', 'Stark Ind.', 'Wayne Ent.', 'Massive Dynamic'];
            const standardMilestones = [
                { desc: "Project Kickoff & Alignment", offsetDays: 5 },
                { desc: "First Draft Delivery", offsetDays: 20 },
                { desc: "Final Review & Handover", offsetDays: 45 }
            ];

            return Array.from({ length: 15 }).map((_, index) => {
                const startMonth = Math.floor(Math.random() * 6) + 1;
                const startDateStr = `2026-${String(startMonth).padStart(2, '0')}-01`;
                const startDateObj = new Date(startDateStr);
                
                const endMonth = startMonth + Math.floor(Math.random() * 3) + 1;
                const endDateStr = `2026-${String(endMonth > 12 ? 12 : endMonth).padStart(2, '0')}-${String(Math.floor(Math.random() * 28) + 1).padStart(2, '0')}`;
                
                const receiveNote = Math.random() > 0.4;
                const invoice = receiveNote ? Math.random() > 0.3 : Math.random() > 0.8; 
                
                const numMilestones = Math.floor(Math.random() * 3) + 1;
                const contractMilestones = [];
                for(let i=0; i<numMilestones; i++) {
                    const mDate = new Date(startDateObj);
                    mDate.setDate(mDate.getDate() + standardMilestones[i].offsetDays + (Math.floor(Math.random() * 10)));
                    contractMilestones.push({
                        id: `M-${index}-${i}`,
                        description: standardMilestones[i].desc,
                        deliveryDate: mDate.toISOString().split('T')[0],
                        completed: Math.random() > 0.5
                    });
                }

                return {
                    id: `CTR-2026-${String(index + 1).padStart(3, '0')}`,
                    client: companies[index % companies.length] + (index > 7 ? ` ${index}` : ''),
                    startDate: startDateStr,
                    endDate: endDateStr,
                    receiveNoteSigned: receiveNote,
                    invoiceSubmitted: invoice,
                    milestones: contractMilestones
                };
            });
        };

        function App() {
            const [contracts, setContracts] = useState(generateMockData());
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [expandedRowId, setExpandedRowId] = useState(null);
            
            const [aiLoading, setAiLoading] = useState(false);
            const [aiContent, setAiContent] = useState('');
            const [aiModalOpen, setAiModalOpen] = useState(false);
            const fileInputRef = useRef(null);
            const [uploadMessage, setUploadMessage] = useState('');

            const toggleReceiveNote = (id) => setContracts(contracts.map(c => c.id === id ? { ...c, receiveNoteSigned: !c.receiveNoteSigned } : c));
            const toggleInvoice = (id) => setContracts(contracts.map(c => c.id === id ? { ...c, invoiceSubmitted: !c.invoiceSubmitted } : c));
            const toggleRow = (id) => setExpandedRowId(expandedRowId === id ? null : id);
            
            const toggleMilestone = (contractId, milestoneId) => {
                setContracts(contracts.map(c => {
                    if (c.id !== contractId) return c;
                    return { ...c, milestones: c.milestones.map(m => m.id === milestoneId ? { ...m, completed: !m.completed } : m) };
                }));
            };

            const fetchAIRecommendations = async () => {
                setAiModalOpen(true);
                setAiLoading(true);
                setAiContent('');

                const pendingContracts = contracts.filter(c => !c.receiveNoteSigned || !c.invoiceSubmitted || c.milestones.some(m => !m.completed));
                const dataSummary = pendingContracts.map(c => ({
                    id: c.id,
                    client: c.client,
                    missingNote: !c.receiveNoteSigned,
                    missingInvoice: !c.invoiceSubmitted,
                    pendingMilestones: c.milestones.filter(m => !m.completed).map(m => `${m.description} (Due: ${m.deliveryDate})`)
                }));

                const prompt = `You are a strict, highly efficient Contract & Deliverables Manager. I am providing you with a JSON list of my currently pending contracts, including their missing deliverables (Receive Notes, Invoices) and uncompleted milestones with delivery dates. 
                
                Please provide a brief, actionable report:
                1. Identify the Top 3 Highest Priority items that need immediate attention.
                2. Provide 2-3 bulleted recommendations on how to unblock these bottlenecks.
                
                Keep the tone professional and urgent. 
                Data: ${JSON.stringify(dataSummary.slice(0, 20))}`;

                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                
                const maxRetries = 5;
                let attempt = 0;

                while (attempt <= maxRetries) {
                    try {
                        // Smart Model Selection: 
                        // If user pastes an API key (Vercel), it uses the standard 1.5-flash model. 
                        // If it's empty (Canvas Environment), it uses the preview model.
                        const modelName = apiKey ? "gemini-1.5-flash" : "gemini-2.5-flash-preview-09-2025";
                        
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const data = await response.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "No recommendations generated.";
                        setAiContent(text);
                        setAiLoading(false);
                        return;
                    } catch (error) {
                        attempt++;
                        if (attempt > maxRetries) {
                            setAiContent("Sorry, I encountered an error connecting to the AI. Please ensure you have pasted a valid Gemini API key into the `apiKey` variable in the code.");
                            setAiLoading(false);
                            return;
                        }
                        await new Promise(resolve => setTimeout(resolve, 1000 * Math.pow(2, attempt - 1)));
                    }
                }
            };

            const handleExportCSV = () => {
                const headers = "Contract ID,Client Name,Start Date,End Date,Receive Note Signed,Invoice Submitted,Milestones\n";
                const rows = filteredContracts.map(c => 
                    `${c.id},"${c.client}",${c.startDate},${c.endDate},${c.receiveNoteSigned ? 'Yes' : 'No'},${c.invoiceSubmitted ? 'Yes' : 'No'},'${JSON.stringify(c.milestones || [])}'`
                ).join("\n");
                const blob = new Blob([headers + rows], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'contracts_export.csv';
                a.click();
                window.URL.revokeObjectURL(url);
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const lines = text.split('\n').filter(line => line.trim() !== '');
                        if (lines.length < 2) return;
                        
                        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                        const idIdx = headers.findIndex(h => h.includes('id'));
                        const clientIdx = headers.findIndex(h => h.includes('client'));
                        const startIdx = headers.findIndex(h => h.includes('start'));
                        const endIdx = headers.findIndex(h => h.includes('end'));
                        const receiveIdx = headers.findIndex(h => h.includes('receive'));
                        const invoiceIdx = headers.findIndex(h => h.includes('invoice'));
                        const milestoneIdx = headers.findIndex(h => h.includes('milestones'));

                        const newContracts = lines.slice(1).map((line, index) => {
                            const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                            const cleanVal = (val) => val ? val.replace(/^"|"$/g, '').replace(/^'|'$/g, '').trim() : '';
                            
                            const rVal = receiveIdx !== -1 ? cleanVal(values[receiveIdx]).toLowerCase() : '';
                            const iVal = invoiceIdx !== -1 ? cleanVal(values[invoiceIdx]).toLowerCase() : '';
                            
                            let parsedMilestones = [];
                            if (milestoneIdx !== -1 && values[milestoneIdx]) {
                                try { parsedMilestones = JSON.parse(cleanVal(values[milestoneIdx])); } catch(e) {}
                            }

                            return {
                                id: cleanVal(values[idIdx]) || `NEW-${index}`,
                                client: cleanVal(values[clientIdx]) || 'Unknown Client',
                                startDate: startIdx !== -1 ? cleanVal(values[startIdx]) : '2026-01-01',
                                endDate: endIdx !== -1 ? cleanVal(values[endIdx]) : '2026-12-31',
                                receiveNoteSigned: rVal === 'true' || rVal === 'yes' || rVal === '1',
                                invoiceSubmitted: iVal === 'true' || iVal === 'yes' || iVal === '1',
                                milestones: parsedMilestones
                            };
                        });
                        
                        setContracts(newContracts);
                        setUploadMessage(`✅ Loaded ${newContracts.length} contracts.`);
                        setTimeout(() => setUploadMessage(''), 5000);
                    } catch (err) {
                        setUploadMessage('❌ Error parsing CSV.');
                        setTimeout(() => setUploadMessage(''), 5000);
                    }
                };
                reader.readAsText(file);
                event.target.value = null; 
            };

            const metrics = useMemo(() => {
                const total = contracts.length;
                const closed = contracts.filter(c => c.receiveNoteSigned && c.invoiceSubmitted && c.milestones.every(m => m.completed)).length;
                const pendingNotes = contracts.filter(c => !c.receiveNoteSigned).length;
                let pendingMilestonesCount = 0;
                contracts.forEach(c => { c.milestones.forEach(m => { if (!m.completed) pendingMilestonesCount++; }); });
                return { total, closed, pendingNotes, pendingMilestonesCount, completionRate: total > 0 ? Math.round((closed / total) * 100) : 0 };
            }, [contracts]);

            const filteredContracts = useMemo(() => {
                return contracts.filter(c => {
                    const isClosed = c.receiveNoteSigned && c.invoiceSubmitted && c.milestones.every(m => m.completed);
                    const matchesSearch = c.id.toLowerCase().includes(searchTerm.toLowerCase()) || c.client.toLowerCase().includes(searchTerm.toLowerCase());
                    if (!matchesSearch) return false;
                    if (statusFilter === 'Closed') return isClosed;
                    if (statusFilter === 'Pending') return !isClosed;
                    return true;
                });
            }, [contracts, searchTerm, statusFilter]);

            return (
                <div className="min-h-screen p-6 pb-20">
                    <div className="max-w-7xl mx-auto space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Deliverables Dashboard</h1>
                                <div className="flex items-center gap-4 mt-1">
                                    <p className="text-slate-500 flex items-center gap-2">
                                        <IconFileSpreadsheet className="w-4 h-4" /> Tracking {contracts.length} contracts
                                    </p>
                                    {uploadMessage && (
                                        <span className={`text-xs font-medium px-2.5 py-1 rounded-md ${uploadMessage.includes('Error') ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                            {uploadMessage}
                                        </span>
                                    )}
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                <button onClick={fetchAIRecommendations} className="flex items-center gap-2 px-4 py-2 bg-purple-600 text-white rounded-lg shadow-sm hover:bg-purple-700 transition-colors text-sm font-medium">
                                    <IconSparkles className="w-4 h-4" /> AI Priority Recommendations
                                </button>
                                <button onClick={handleExportCSV} className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg shadow-sm hover:bg-slate-50 transition-colors text-sm font-medium text-slate-600">
                                    <IconDownload className="w-4 h-4" /> Export CSV
                                </button>
                                <input type="file" accept=".csv" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg shadow-sm hover:bg-blue-700 transition-colors text-sm font-medium">
                                    <IconUpload className="w-4 h-4" /> Upload CSV
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div><p className="text-sm font-medium text-slate-500">Total Contracts</p><p className="text-3xl font-bold text-slate-900 mt-2">{metrics.total}</p></div>
                                    <div className="p-3 bg-blue-50 text-blue-600 rounded-lg"><IconFileText className="w-6 h-6" /></div>
                                </div>
                            </div>
                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div><p className="text-sm font-medium text-slate-500">Fully Closed</p><p className="text-3xl font-bold text-emerald-600 mt-2">{metrics.closed}</p></div>
                                    <div className="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><IconCheckCircle className="w-6 h-6" /></div>
                                </div>
                                <div className="mt-4 flex items-center gap-2 text-sm text-slate-600">
                                    <div className="w-full bg-slate-100 rounded-full h-2"><div className="bg-emerald-500 h-2 rounded-full transition-all duration-500" style={{ width: `${metrics.completionRate}%` }}></div></div>
                                    <span className="font-medium">{metrics.completionRate}%</span>
                                </div>
                            </div>
                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div><p className="text-sm font-medium text-slate-500">Missing Signatures</p><p className="text-3xl font-bold text-amber-600 mt-2">{metrics.pendingNotes}</p></div>
                                    <div className="p-3 bg-amber-50 text-amber-600 rounded-lg"><IconAlertCircle className="w-6 h-6" /></div>
                                </div>
                            </div>
                            <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                <div className="flex justify-between items-start">
                                    <div><p className="text-sm font-medium text-slate-500">Pending Milestones</p><p className="text-3xl font-bold text-rose-600 mt-2">{metrics.pendingMilestonesCount}</p></div>
                                    <div className="p-3 bg-rose-50 text-rose-600 rounded-lg"><IconTrendingUp className="w-6 h-6" /></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="p-4 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row justify-between gap-4 items-center">
                                <div className="relative w-full sm:w-72">
                                    <IconSearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input type="text" placeholder="Search by ID or Client..." className="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                </div>
                                <div className="flex items-center gap-2 w-full sm:w-auto">
                                    <IconFilter className="w-4 h-4 text-slate-400" />
                                    <select className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-blue-500 block w-full py-2 px-3" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                                        <option value="All">All Statuses</option>
                                        <option value="Pending">Active / Pending</option>
                                        <option value="Closed">Contract Closed</option>
                                    </select>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm text-slate-600">
                                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                        <tr>
                                            <th className="px-6 py-4 font-semibold">Contract ID</th>
                                            <th className="px-6 py-4 font-semibold">Client Name</th>
                                            <th className="px-6 py-4 font-semibold">Timeline</th>
                                            <th className="px-6 py-4 font-semibold">Milestones</th>
                                            <th className="px-6 py-4 font-semibold text-center">Receive Note</th>
                                            <th className="px-6 py-4 font-semibold text-center">Invoice</th>
                                            <th className="px-6 py-4 font-semibold text-right">Overall Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredContracts.length === 0 ? (
                                            <tr><td colSpan="7" className="px-6 py-12 text-center text-slate-500">No contracts found.</td></tr>
                                        ) : (
                                            filteredContracts.map((contract) => {
                                                const milestonesCompleted = contract.milestones.filter(m => m.completed).length;
                                                const totalMilestones = contract.milestones.length;
                                                const allMilestonesDone = totalMilestones > 0 && milestonesCompleted === totalMilestones;
                                                const isClosed = contract.receiveNoteSigned && contract.invoiceSubmitted && (totalMilestones === 0 || allMilestonesDone);
                                                const isExpanded = expandedRowId === contract.id;
                                                
                                                return (
                                                    <React.Fragment key={contract.id}>
                                                        <tr className={`bg-white border-b border-slate-100 hover:bg-slate-50 transition-colors ${isExpanded ? 'bg-slate-50' : ''}`}>
                                                            <td className="px-6 py-4 font-medium text-slate-900 whitespace-nowrap">{contract.id}</td>
                                                            <td className="px-6 py-4">{contract.client}</td>
                                                            <td className="px-6 py-4">
                                                                <div className="flex flex-col text-xs">
                                                                    <span className="text-slate-500">Start: <span className="font-medium text-slate-700">{contract.startDate}</span></span>
                                                                    <span className="text-slate-500 mt-1">End: <span className="font-medium text-slate-700">{contract.endDate}</span></span>
                                                                </div>
                                                            </td>
                                                            <td className="px-6 py-4">
                                                                <button onClick={() => toggleRow(contract.id)} className="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-md text-xs font-medium text-slate-600 hover:bg-slate-100 transition-colors">
                                                                    <span className={allMilestonesDone && totalMilestones > 0 ? 'text-emerald-600' : ''}>{milestonesCompleted} / {totalMilestones} Done</span>
                                                                    {isExpanded ? <IconChevronUp className="w-3.5 h-3.5" /> : <IconChevronDown className="w-3.5 h-3.5" />}
                                                                </button>
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <button onClick={() => toggleReceiveNote(contract.id)} className={`inline-flex p-1 rounded-md transition-colors ${contract.receiveNoteSigned ? 'text-emerald-600 hover:bg-emerald-50' : 'text-slate-400 hover:bg-slate-100'}`}>
                                                                    {contract.receiveNoteSigned ? <IconCheckSquare className="w-5 h-5" /> : <IconSquare className="w-5 h-5" />}
                                                                </button>
                                                            </td>
                                                            <td className="px-6 py-4 text-center">
                                                                <button onClick={() => toggleInvoice(contract.id)} className={`inline-flex p-1 rounded-md transition-colors ${contract.invoiceSubmitted ? 'text-emerald-600 hover:bg-emerald-50' : 'text-slate-400 hover:bg-slate-100'}`}>
                                                                    {contract.invoiceSubmitted ? <IconCheckSquare className="w-5 h-5" /> : <IconSquare className="w-5 h-5" />}
                                                                </button>
                                                            </td>
                                                            <td className="px-6 py-4 text-right">
                                                                <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold ${isClosed ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-50 text-blue-700'}`}>
                                                                    {isClosed ? <IconCheckCircle className="w-3.5 h-3.5" /> : <IconCircle className="w-3.5 h-3.5" />}
                                                                    {isClosed ? 'Closed' : 'Active'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                        {isExpanded && (
                                                            <tr className="bg-slate-50/80 border-b border-slate-200">
                                                                <td colSpan="7" className="px-6 py-4">
                                                                    <div className="pl-4 border-l-2 border-blue-400 py-2">
                                                                        <h4 className="text-xs font-bold text-slate-500 uppercase mb-3">Milestone Deliverables</h4>
                                                                        {contract.milestones.length === 0 ? (
                                                                            <p className="text-sm text-slate-500 italic">No milestones defined.</p>
                                                                        ) : (
                                                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                                                {contract.milestones.map(milestone => (
                                                                                    <div key={milestone.id} onClick={() => toggleMilestone(contract.id, milestone.id)} className={`p-3 rounded-lg border cursor-pointer transition-colors flex items-start gap-3 ${milestone.completed ? 'bg-emerald-50/50 border-emerald-200' : 'bg-white border-slate-200 hover:border-blue-300'}`}>
                                                                                        <div className={`mt-0.5 ${milestone.completed ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                                                            {milestone.completed ? <IconCheckSquare className="w-4 h-4" /> : <IconSquare className="w-4 h-4" />}
                                                                                        </div>
                                                                                        <div>
                                                                                            <p className={`text-sm font-medium ${milestone.completed ? 'text-emerald-800 line-through opacity-70' : 'text-slate-700'}`}>{milestone.description}</p>
                                                                                            <p className="text-xs text-slate-500 mt-1 flex items-center gap-1">Target: {milestone.deliveryDate}</p>
                                                                                        </div>
                                                                                    </div>
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        )}
                                                    </React.Fragment>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* AI MODAL */}
                    {aiModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
                                    <h3 className="font-semibold text-slate-800 flex items-center gap-2">
                                        <IconSparkles className="w-5 h-5 text-purple-600" /> AI Priority Recommendations
                                    </h3>
                                    <button onClick={() => setAiModalOpen(false)} className="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-200 transition-colors">
                                        <IconX className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto whitespace-pre-wrap text-sm text-slate-700 leading-relaxed font-medium">
                                    {aiLoading ? (
                                        <div className="flex flex-col items-center justify-center py-12 text-slate-400">
                                            <IconLoader2 className="w-8 h-8 animate-spin mb-4 text-purple-600" />
                                            <p>Analyzing contract milestones and missing deliverables...</p>
                                        </div>
                                    ) : (
                                        <div dangerouslySetInnerHTML={{ __html: aiContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>') }} />
                                    )}
                                </div>
                                {!aiLoading && (
                                    <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                                        <button onClick={() => setAiModalOpen(false)} className="px-4 py-2 bg-purple-600 text-white rounded-lg shadow-sm hover:bg-purple-700 transition-colors text-sm font-medium">
                                            Done
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
